<h2 class="section-title">{{ editando ? 'Editar película' : 'Registrar nueva película' }}</h2>

<div class="tmdb-search">
  <label>Buscar película en TMDB (autocompletar)</label>
  <div class="tmdb-search__row">
    <input type="text" [(ngModel)]="tituloBusqueda" name="tituloBusqueda" placeholder="Ej: Matrix">
    <button type="button" class="btn btn-primary" (click)="buscarEnTmdb()">Buscar</button>
  </div>

  <p *ngIf="buscando" class="loading-text">Buscando...</p>

  <div class="tmdb-results" *ngIf="resultadosTmdb.length > 0">
    <div class="tmdb-result" *ngFor="let r of resultadosTmdb" (click)="seleccionarResultadoTmdb(r)">
      <img [src]="r.imagenUrl || 'https://via.placeholder.com/100x150'">
      <p>{{ r.titulo }} ({{ r.anio }})</p>
    </div>
  </div>
</div>

<div class="form-panel">
  <form (ngSubmit)="guardarPelicula()" class="form-grid">
    <div class="form-field">
      <label>Título</label>
      <input type="text" [(ngModel)]="nuevaPelicula.titulo" name="titulo" required>
    </div>

    <div class="form-field">
      <label>Mi reseña</label>
      <textarea [(ngModel)]="nuevaPelicula.resenaPersonal" name="resenaPersonal" rows="3"></textarea>
    </div>

    <div class="form-field">
      <label>Género</label>
      <input type="text" [(ngModel)]="nuevaPelicula.genero" name="genero">
    </div>

    <div class="form-field">
      <label>Año</label>
      <input type="number" [(ngModel)]="nuevaPelicula.anio" name="anio">
    </div>

    <div class="form-field">
      <label>Estado</label>
      <select [(ngModel)]="nuevaPelicula.estado" name="estado">
        <option value="PENDIENTE">Pendiente</option>
        <option value="VIENDO">Viendo</option>
        <option value="VISTA">Vista</option>
      </select>
    </div>

    <div class="form-field">
      <label>Calificación (1.0 a 5.0)</label>
      <input type="number" step="0.5" [(ngModel)]="nuevaPelicula.calificacionPersonal" name="calificacionPersonal" min="1" max="5">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ editando ? 'Actualizar película' : 'Guardar película' }}</button>
      <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
