<mat-toolbar color="primary" class="app-toolbar">
  <span class="brand">CineTrack</span>

  <a mat-button routerLink="/dashboard" routerLinkActive="nav-activo" [routerLinkActiveOptions]="{exact: true}">
    <mat-icon>dashboard</mat-icon> Panel
  </a>
  <a mat-button routerLink="/peliculas" routerLinkActive="nav-activo" [routerLinkActiveOptions]="{exact: true}">
    <mat-icon>movie</mat-icon> Catálogo
  </a>
  <a mat-button routerLink="/peliculas/nueva" routerLinkActive="nav-activo">
    <mat-icon>add</mat-icon> Nueva película
  </a>

  <span class="toolbar-spacer"></span>

  <span class="backend-badge">
    <span class="dot"></span> Backend conectado
  </span>
</mat-toolbar>
