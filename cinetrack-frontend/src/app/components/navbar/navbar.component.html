<mat-toolbar color="primary" class="app-toolbar">
  <span class="brand">CineTrack</span>

  <a mat-button routerLink="/dashboard" routerLinkActive="nav-activo" [routerLinkActiveOptions]="{exact: true}">
    Panel
  </a>
  <a mat-button routerLink="/peliculas" routerLinkActive="nav-activo" [routerLinkActiveOptions]="{exact: true}">
    Catálogo
  </a>
  <a mat-button routerLink="/peliculas/nueva" routerLinkActive="nav-activo">
    Nueva película
  </a>

  <span class="toolbar-spacer"></span>

  <span class="backend-badge"
        [class.backend-badge--off]="estadoBackend.conectado() === false"
        [class.backend-badge--check]="estadoBackend.conectado() === null">
    <span class="dot"></span>
    @if (estadoBackend.conectado() === null) { Comprobando servidor... }
    @else if (estadoBackend.conectado()) { Backend conectado }
    @else { Backend sin conexión }
  </span>
</mat-toolbar>
