spring.application.name=cinetrack

# --- Persistencia: H2 en modo ARCHIVO (no en memoria) ---
spring.datasource.url=jdbc:h2:file:./data/cinetrackdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# IMPORTANTE: 'update' conserva los datos entre reinicios.
# NUNCA uses 'create-drop' aquí: borra toda la BD cada vez que apagas la app.
spring.jpa.hibernate.ddl-auto=update

# Opcional pero útil para ver la BD desde el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# --- Integración API externa: TMDB ---
tmdb.api.key=ff2061cca515fbba66be273276d057ea
tmdb.api.url=https://api.themoviedb.org/3